name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://d3te863nebxng5.cloudfront.net' }}
          VITE_IMAGE_BASE_URL: ${{ secrets.VITE_IMAGE_BASE_URL || 'https://d3te863nebxng5.cloudfront.net' }}
          VITE_SITE_URL: https://dangkhoaow.github.io/av-foundation-frontend-web
          PRERENDER_MAX_ARTWORKS: 500

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test:
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Generate test plan
        run: node .agent/skills/test-testing-plan/scripts/generate-test-plan.mjs

      - name: Run unit tests
        run: npm run test:unit

      - name: Wait for GH Pages
        run: |
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "https://dangkhoaow.github.io/av-foundation-frontend-web/")
            if [ "$status" = "200" ]; then
              echo "GH Pages is reachable."
              exit 0
            fi
            echo "Waiting for GH Pages... ($i/30)"
            sleep 10
          done
          echo "GH Pages did not become reachable in time."
          exit 1

      - name: Run E2E test runner
        run: npm run test:runner
        env:
          E2E_BASE_URL: https://dangkhoaow.github.io/av-foundation-frontend-web/
          ISSUES_ENABLED: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            playwright-report
            test-results
            .agent/skills/test-testing-plan/plans
            .agent/skills/test-runner/runs
            .agent/skills/test-runner/issues
